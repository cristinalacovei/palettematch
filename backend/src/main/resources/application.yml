server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/palettematch}
    username: ${DB_USERNAME:palettematch}
    password: ${DB_PASSWORD:palettematch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/palettematch}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/palettematch/protocol/openid-connect/certs}

app:
  auth:
    mode: ${APP_AUTH_MODE:keycloak}
    demo:
      password-bcrypt: ${DEMO_PASSWORD_BCRYPT:}
      jwt-private-key-base64: ${DEMO_JWT_PRIVATE_KEY_BASE64:}
      jwt-public-key-base64: ${DEMO_JWT_PUBLIC_KEY_BASE64:}
      jwt-issuer: ${DEMO_JWT_ISSUER:https://palettematch-demo}
      jwt-audience: ${DEMO_JWT_AUDIENCE:palettematch-api}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
